name: Build TubeTube APK

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore:
      - 'README.md'
      - 'doc/**'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: write # publish releases for v* tags

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Code style checks
        run: ./gradlew :app:runCheckstyle :app:runKtlint :app:checkDependenciesOrder

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest -DskipFormatKtlint

      - name: Build release APK
        run: ./gradlew :app:assembleRelease -DskipFormatKtlint

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          VERSION="$(jq -r '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)"
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          mkdir -p dist

          if [ -n "${KEYSTORE_BASE64}" ] && [ -n "${KEYSTORE_PASSWORD}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > "$RUNNER_TEMP/tubetube.jks"
            OUT="dist/TubeTube-v${VERSION}.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/tubetube.jks" --ks-pass env:KEYSTORE_PASSWORD \
              --out "$OUT" "$RUNNER_TEMP/aligned.apk"
            rm -f "$RUNNER_TEMP/tubetube.jks"
            echo "SIGNED_WITH_RELEASE_KEY=true" >> "$GITHUB_ENV"
          else
            echo "::warning title=Signed with a throwaway key::Add the KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets (see README). Later builds will NOT install over this APK."
            keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.jks" -storetype PKCS12 -alias test \
              -keyalg RSA -keysize 2048 -validity 30 -dname "CN=TubeTube test build" \
              -storepass throwaway -keypass throwaway
            OUT="dist/TubeTube-v${VERSION}-TEST-KEY.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/throwaway.jks" --ks-pass pass:throwaway \
              --out "$OUT" "$RUNNER_TEMP/aligned.apk"
            echo "SIGNED_WITH_RELEASE_KEY=false" >> "$GITHUB_ENV"
          fi

          {
            echo "### $(basename "$OUT")"
            echo '```'
            "$BT/apksigner" verify --print-certs "$OUT" | grep -E "SHA-256|DN"
            echo "APK SHA-256: $(sha256sum "$OUT" | cut -d' ' -f1)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: TubeTube-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${SIGNED_WITH_RELEASE_KEY}" != "true" ]; then
            echo "::error::Refusing to publish a release signed with a throwaway key. Add the signing secrets first."
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk --title "TubeTube $GITHUB_REF_NAME" \
              --notes "Instale o APK abaixo. Verifique o SHA-256 no resumo do workflow."
          fi

      - name: Archive reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: '*/build/reports'
